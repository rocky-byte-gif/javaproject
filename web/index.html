<!DOCTYPE html>
<html>
<head>
    <title>GrievanceGPT - Municipal Complaint System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h2>GrievanceGPT - Municipal Complaint System</h2>
    <div class="nav">
        <a href="/">Home</a> | <a href="/track">Track</a> | <a href="/admin">Admin</a> | <a href="/concepts">Concepts</a>
    </div>

    <div class="error">{{error}}</div>

    <h3>Register New Complaint</h3>
    <form action="/submit" method="post">
        <table>
            <tr>
                <td>Citizen Name:</td>
                <td><input type="text" name="name" value="{{name}}"></td>
            </tr>
            <tr>
                <td>Ward:</td>
                <td>
                    <select name="ward">
                        <option value="Ward 1">Ward 1</option>
                        <option value="Ward 2">Ward 2</option>
                        <option value="Ward 3">Ward 3</option>
                        <option value="Ward 4">Ward 4</option>
                        <option value="Ward 5">Ward 5</option>
                        <option value="Ward 6">Ward 6</option>
                        <option value="Ward 7">Ward 7</option>
                        <option value="Ward 8">Ward 8</option>
                        <option value="Ward 9">Ward 9</option>
                        <option value="Ward 10">Ward 10</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Complaint Text:</td>
                <td>
                    <textarea name="text" rows="5" cols="45">{{text}}</textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Submit Complaint"></td>
            </tr>
        </table>
    </form>
    <p class="note">Uses: Practical 1 (Control flow), Practical 4 (Overloaded register), Practical 7 (Validation exception), Practical 9 (String methods)</p>
</body>
</html>
